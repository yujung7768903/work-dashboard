<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업 대시보드</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/usage.css">
</head>
<body>
  <div class="app">
    <!-- 좌측 레일. 좁은 화면에서는 상단 가로 메뉴로 접힘 -->
    <aside class="app-side">
      <div class="side-brand">
        <span class="side-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <path d="M2.5 7.2 8 2.6l5.5 4.6V13a.9.9 0 0 1-.9.9H3.4a.9.9 0 0 1-.9-.9z"
                  fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="side-name">작업 대시보드</span>
      </div>

      <nav id="tabs" class="side-nav">
        <button data-tab="usage">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M2.3 11.6a6 6 0 1 1 11.4 0" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
            <path d="M8 11.3l3-3.4" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          사용량
        </button>
        <button data-tab="board" class="active">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M2.5 7.2 8 2.6l5.5 4.6V13a.9.9 0 0 1-.9.9H3.4a.9.9 0 0 1-.9-.9z"
                  fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          보드
        </button>
        <button data-tab="workspace">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M2.2 4.3a.9.9 0 0 1 .9-.9h2.6l1.4 1.8h6a.9.9 0 0 1 .9.9v5.7a.9.9 0 0 1-.9.9H3.1a.9.9 0 0 1-.9-.9z"
                  fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          워크스페이스
        </button>
        <button data-tab="settings">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M8.6 2.2H13a.8.8 0 0 1 .8.8v4.4L7.9 13.3a.8.8 0 0 1-1.2 0L2.7 9.3a.8.8 0 0 1 0-1.2z"
                  fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10.8" cy="5.2" r="1" fill="currentColor"/>
          </svg>
          설정
        </button>
      </nav>

      <!-- 현재 상태 한 줄 자리. 비어 있어도 무해 -->
      <div id="rail-status"></div>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <h1 id="page-title">보드</h1>
        <p id="error" hidden></p>
      </header>

      <section id="tab-board" class="tab">
        <!-- 여기부터 카테고리 라벨까지는 두 하위 탭이 함께 쓴다 -->
        <p id="next-line">다음에 할 일 ▸ <span id="next-text">불러오는 중</span></p>
        <!-- 기본 접힘. 펼치면 자율 실행으로 돌린 할일 목록 -->
        <details id="autorun-panel">
          <summary>
            <span id="autorun-head">
              <span>자율 수행</span>
              <span id="autorun-dot"></span>
              <span id="autorun-cycle"></span>
            </span>
          </summary>
          <ul id="autorun-list"></ul>
        </details>
        <!-- 기본 접힘. 펼쳐도 진행중만 보이고 대기 중은 목록 하단 토글로 -->
        <details id="session-panel">
          <summary>
            <span id="session-head">
              <span id="session-count">돌고 있는 세션 0</span>
              <span id="session-warn" hidden></span>
            </span>
          </summary>
          <ul id="session-list"></ul>
        </details>
        <form id="quick-add">
          <select id="quick-category" title="카테고리"></select>
          <input id="quick-title" placeholder="빠른 추가 (장애·문의)" required>
          <button type="submit" id="quick-submit" title="할일 추가">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <details id="quick-extra">
            <summary>착수 조건·note</summary>
            <div class="field">
              <label for="quick-precondition">착수 조건</label>
              <textarea id="quick-precondition"></textarea>
            </div>
            <div class="field">
              <label for="quick-note">note</label>
              <textarea id="quick-note"></textarea>
            </div>
          </details>
        </form>
        <div id="category-filter"></div>

        <!-- 공통 영역 바로 아래. 레일 메뉴와 달리 밑줄로만 고른 것을 표시한다 -->
        <nav id="board-tabs" class="subtabs">
          <button data-subtab="todos" class="active">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M2.5 4.5 4 6l2.5-2.5M8.5 4.8H14M2.5 11 4 12.5 6.5 10M8.5 11.3H14"
                    fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            할일
          </button>
          <button data-subtab="worktrees">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="4.5" cy="3.6" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="4.5" cy="12.4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="11.5" cy="3.6" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4.5 5.4v5.2M11.5 5.4v1.3a2.4 2.4 0 0 1-2.4 2.4H6.9"
                    fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            워크트리
          </button>
        </nav>

        <div id="board-todos">
        <div id="board-controls">
          <label><input type="checkbox" id="show-done"> 완료 항목 표시</label>
        </div>
        <div id="groups"></div>
        <details id="done-today">
          <summary>완료</summary>
          <div id="done-groups"></div>
        </details>
        </div>

        <div id="board-worktrees" hidden>
          <div id="worktree-list"></div>
        </div>
      </section>

      <section id="tab-workspace" class="tab" hidden>
        <form id="workspace-add">
          <input id="workspace-new-name" placeholder="새 워크스페이스" required>
          <select id="workspace-new-category"></select>
          <button type="submit">추가</button>
        </form>
        <div id="workspace-list"></div>
      </section>

      <section id="tab-settings" class="tab" hidden>
        <!-- 카테고리는 소속(하나), 라벨은 성격(여러 개). 같은 화면에서 색까지 관리한다 -->
        <h2 class="set-head">카테고리</h2>
        <form id="category-add">
          <input id="category-name" placeholder="새 카테고리" required>
          <button type="submit">추가</button>
        </form>
        <ul id="category-list" class="set-list"></ul>

        <h2 class="set-head">라벨</h2>
        <form id="label-add">
          <input id="label-name" placeholder="새 라벨" required>
          <button type="submit">추가</button>
        </form>
        <ul id="label-list" class="set-list"></ul>
      </section>

      <section id="tab-usage" class="tab" hidden>
        <div class="u-shell">
          <div class="u-main">
            <div class="u-row3" id="u-limits"></div>
            <div class="u-row2">
              <div id="u-trend"></div>
              <div id="u-share"></div>
            </div>
            <div class="u-row2">
              <div id="u-daily"></div>
              <div id="u-today"></div>
            </div>
            <div class="u-row2">
              <div id="u-weekly"></div>
              <div id="u-weekly-tokens"></div>
            </div>
          </div>
          <aside class="u-rail">
            <section class="u-rail-section" id="u-next"></section>
            <section class="u-rail-section" id="u-sessions"></section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <dialog id="session-modal">
    <form method="dialog"><button class="modal-close" aria-label="닫기">×</button></form>
    <div id="session-modal-body"></div>
  </dialog>

  <!-- 워크스페이스 카드의 + 버튼이 여는 추가 폼. 세 값을 한 번에 받는다 —
       prompt 를 연달아 띄우면 브라우저가 둘째부터 억제해 제목만 물어본 꼴이 된다 -->
  <dialog id="todo-add-modal">
    <form method="dialog"><button class="modal-close" aria-label="닫기">×</button></form>
    <form id="todo-add-form">
      <div class="dlg-head"><p class="dlg-title" id="todo-add-scope"></p></div>
      <div class="field">
        <label for="todo-add-title">제목</label>
        <input id="todo-add-title" required>
      </div>
      <div class="field">
        <label for="todo-add-precondition">착수 조건</label>
        <textarea id="todo-add-precondition"></textarea>
      </div>
      <div class="field">
        <label for="todo-add-note">note</label>
        <textarea id="todo-add-note"></textarea>
      </div>
      <div class="dlg-actions"><button type="submit">추가</button></div>
    </form>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
