<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업 대시보드</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <h1>작업 대시보드</h1>
    <nav id="tabs">
      <button data-tab="board" class="active">보드</button>
      <button data-tab="workspace">워크스페이스</button>
      <button data-tab="categories">카테고리</button>
      <button data-tab="usage">사용량</button>
    </nav>
  </header>

  <p id="error" hidden></p>

  <section id="tab-board" class="tab">
    <p id="next-line">다음에 할 일 ▸ <span id="next-text">불러오는 중</span></p>
    <div id="session-panel">
      <div id="session-head">
        <span id="session-count">돌고 있는 세션 0</span>
        <span id="session-warn" hidden></span>
      </div>
      <ul id="session-list"></ul>
    </div>
    <form id="quick-add">
      <select id="quick-category" title="카테고리"></select>
      <input id="quick-title" placeholder="빠른 추가 (장애·문의)" required>
      <button type="submit" id="quick-submit" title="할일 추가">+</button>
    </form>
    <div id="category-filter"></div>
    <div id="board-controls">
      <label><input type="checkbox" id="show-done"> 완료 항목 표시</label>
    </div>
    <div id="groups"></div>
    <details id="done-today">
      <summary>완료</summary>
      <div id="done-groups"></div>
    </details>
  </section>

  <section id="tab-workspace" class="tab" hidden>
    <form id="workspace-add">
      <input id="workspace-new-name" placeholder="새 워크스페이스" required>
      <select id="workspace-new-category"></select>
      <button type="submit">추가</button>
    </form>
    <div id="workspace-list"></div>
  </section>

  <section id="tab-categories" class="tab" hidden>
    <form id="category-add">
      <input id="category-name" placeholder="새 카테고리" required>
      <button type="submit">추가</button>
    </form>
    <ul id="category-list"></ul>
  </section>

  <section id="tab-usage" class="tab" hidden>
    <div class="usage-top">
      <div class="usage-card usage-now">
        <div class="usage-head">
          <span id="usage-plan" class="usage-plan">플랜</span>
          <span id="usage-updated" class="usage-meta">불러오는 중</span>
          <span id="usage-stale" class="usage-warn" hidden></span>
        </div>
        <p id="usage-hero" class="usage-hero">―</p>
        <p id="usage-hero-label" class="usage-meta">불러오는 중</p>
        <div id="usage-meters"></div>
        <p id="usage-note" class="usage-meta"></p>
      </div>
      <div class="usage-card">
        <h2>한도 사용률 추이 <span class="usage-meta">최근 24시간</span></h2>
        <div id="usage-pct-chart"></div>
      </div>
    </div>
    <div class="usage-card">
      <h2>일별 토큰 <span class="usage-meta">최근 14일 · 입력+출력+캐시 합계</span></h2>
      <div id="usage-token-chart"></div>
      <p class="usage-meta">정가환산은 API 정가 기준 금액이며, 구독제의 실제 청구액이 아님</p>
      <details>
        <summary>표로 보기</summary>
        <div id="usage-table" class="usage-table-box"></div>
      </details>
    </div>
  </section>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
